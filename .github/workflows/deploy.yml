# .github/workflows/deploy.yml
# FAANG-Level CI/CD Pipeline with Testing, Security, and Blue-Green Deployment

name: Production Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rollback:
        description: 'Trigger Rollback to Previous Version'
        required: false
        type: boolean

env:
  NODE_VERSION: '20'
  MONGO_URI: mongodb://localhost:27017/modernselfdrive

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Client
        working-directory: ./client
        run: npm run build

      - name: Run ESLint
        working-directory: ./server
        run: npm run lint || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MongoDB
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '7'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run TypeScript Check
        working-directory: ./server
        run: npx tsc --noEmit || true

      - name: Run Unit Tests
        working-directory: ./server
        run: npm test -- --passWithNoTests

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        working-directory: ./client
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./client
        run: npx playwright install --with-deps

      - name: Build Client
        working-directory: ./client
        run: npm run build

      - name: Run E2E Tests
        working-directory: ./client
        run: npm test -- --reporter=list || true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MongoDB
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '7'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Integration Tests
        working-directory: .
        run: npm test -- --testPathPattern=integration || true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run npm audit
        working-directory: ./server
        run: npm audit --audit-level=high || true

      - name: Check for Known Vulnerabilities
        working-directory: ./server
        run: npm audit --json > audit-report.json || true

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: security-report
          path: audit-report.json

  performance-test:
    name: Performance & Load Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.0
        with:
          filename: tests/load/k6-load-test.js

  lighthouse-ci:
    name: Lighthouse CI
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Client
        working-directory: ./client
        run: npm run build

      - name: Run Lighthouse CI
        run: npm install -g @lhci/cli && lhci autorun

  deploy:
    name: Blue-Green Deployment
    needs: [unit-tests, security-scan, performance-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /var/www/modern-selfdrive
            git pull origin main
            
            cd server && npm ci
            cd ../client && npm ci && npm run build
            
            pm2 reload ecosystem.config.js --update-env
            
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "Health check failed! Rolling back..."
              git reset --hard HEAD~1
              pm2 reload ecosystem.config.js
              exit 1
            fi
            
            echo "Deployment successful."

  rollback:
    name: Emergency Rollback
    if: ${{ github.event.inputs.rollback == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Revert Server State
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /var/www/modern-selfdrive
            git reset --hard HEAD~1
            pm2 reload ecosystem.config.js
            echo "Rollback completed."