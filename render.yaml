services:
  - type: web
    name: modern-drive-api
    runtime: node
    plan: free
    region: oregon
    rootDirectory: server
    buildCommand: npm install --production
    startCommand: node --max-old-space-size=450 src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: NODE_OPTIONS
        value: --max-old-space-size=450
