# nginx.conf
# Nginx Reverse Proxy & Static Asset Server
# Assumes Cloudflare sits in front for DNS/CDN/DDoS.

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name modern-selfdrive.com www.modern-selfdrive.com;
    return 301 https://$host$request_uri;
}

# The PM2 Node.js cluster runs on port 5000
upstream backend_cluster {
    # If running multiple PM2 clusters across VMs, list them here.
    server 127.0.0.1:5000;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modern-selfdrive.com www.modern-selfdrive.com;

    # SSL Certificates (Managed by Certbot/Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/modern-selfdrive.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/modern-selfdrive.com/privkey.pem;

    # Cloudflare IP Restoration - Tells Nginx to trust the Real IP provided by Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Gzip Compression at the Nginx Layer
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Root directory for serving the compiled React app
    root /var/www/modern-selfdrive/client/dist;
    index index.html;

    # Route React Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Asset Caching (JS, CSS, Fonts, Images)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Route API Traffic to the PM2 Cluster
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Forward true client IPs to Node.js
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addres_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route Socket.io WebSockets to the PM2 Cluster
    location /socket.io/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
